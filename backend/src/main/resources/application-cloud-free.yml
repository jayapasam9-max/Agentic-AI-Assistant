# Free-tier overlay: no Kafka, in-process event bus, tight cost caps.
# Activated via SPRING_PROFILES_ACTIVE=cloud-free.

spring:
  kafka:
    # Empty bootstrap-servers prevents any accidental Kafka connection attempts.
    # All Kafka beans (KafkaConfig, KafkaReviewBus, ReviewJobConsumer,
    # ReviewStreamController) are gated behind review-bus.type=kafka and
    # disabled in this profile, so no client ever tries to connect.
    bootstrap-servers: ""

review-bus:
  # Switches the bus from Kafka to Spring's in-process ApplicationEventPublisher.
  # Activates InProcessReviewBus + InProcessReviewJobListener + AsyncConfig.
  type: in-process

# Tighter agent caps for the free-tier deploy. The diff-byte limit is the
# only one currently enforced (see AgentBudget Javadoc); the token caps are
# declared so the wiring is in place when LangChain4j exposes a hook.
agent:
  max-iterations: 8
  budget:
    max-diff-bytes: 512000           # 500 KB — pathological PRs get skipped
    max-input-tokens-per-pr: 200000
    max-output-tokens-per-pr: 20000
